<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Figlo — Korony</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f5ef}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7f5ef}.app{width:100%;max-width:560px;margin:0 auto;padding:18px 14px 28px;text-align:center}.brand{font-size:20px;font-weight:800;letter-spacing:-.04em;margin-bottom:16px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;text-align:left}h1{font-size:32px;line-height:1;margin:0 0 6px;letter-spacing:-.05em}.sub{color:#666;font-size:13px}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;white-space:nowrap}.board{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));aspect-ratio:1;border:3px solid #171717;user-select:none;touch-action:manipulation;overflow:hidden}.cell{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;border:0;padding:0;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#171717;line-height:1;transition:transform .08s,filter .12s;position:relative}.cell:active{transform:scale(.96)}.cell::after{content:"";position:absolute;inset:0;pointer-events:none;border-style:solid;border-color:#171717;border-width:0}.cell.rt::after{border-top-width:3px}.cell.rr::after{border-right-width:3px}.cell.rb::after{border-bottom-width:3px}.cell.rl::after{border-left-width:3px}.mark{display:flex;align-items:center;justify-content:center;width:60%;height:60%;line-height:1;font-family:Arial,"Segoe UI Symbol",sans-serif;font-size:clamp(22px,7vw,34px);font-weight:500}.mark.crown{font-size:clamp(23px,7.2vw,35px)}.cell.bad,.cell.hint-error{box-shadow:inset 0 0 0 5px #d73737}.cell.hint-candidate{box-shadow:inset 0 0 0 5px #fff, inset 0 0 0 8px #171717;animation:pulseHint .8s ease 2}@keyframes pulseHint{50%{filter:brightness(1.14)}}.r0{background:#ef9eae}.r1{background:#7fc6df}.r2{background:#9fd68d}.r3{background:#f2c86f}.r4{background:#b39bd8}.r5{background:#ef9640}.r6{background:#8fbd87}.help{margin:14px auto 0;color:#666;font-size:13px;line-height:1.45;max-width:500px}.auto-row{margin:14px 0 10px;padding:12px 13px;background:#fff;border:1px solid #dedbd3;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left}.auto-copy{min-width:0}.auto-title{font-size:14px;font-weight:800}.auto-desc{font-size:12px;color:#777;margin-top:2px;line-height:1.3}.switch{position:relative;width:48px;height:28px;flex:0 0 auto}.switch input{position:absolute;opacity:0;pointer-events:none}.slider{position:absolute;inset:0;border-radius:999px;background:#d5d2ca;cursor:pointer;transition:.18s}.slider:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:.18s}.switch input:checked+.slider{background:#171717}.switch input:checked+.slider:after{transform:translateX(20px)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.action{min-height:48px;border:1px solid #cfcac0;background:#fff;border-radius:11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.action.primary{grid-column:1/-1;background:#171717;color:#fff;border-color:#171717}.action:disabled{opacity:.4;cursor:default}.status{min-height:24px;margin-top:10px;font-size:14px;font-weight:700}.done{margin-top:12px;padding:15px;border:2px solid #171717;border-radius:12px;background:#fff;display:none}.done.show{display:block}.done strong{font-size:22px}@media(min-width:700px){.app{padding:28px 20px 36px}.brand{margin-bottom:22px}h1{font-size:38px}.help{font-size:14px;margin-top:16px}.auto-row{margin-top:16px}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">figlo</div>
  <div class="top"><div><h1>Korony</h1><div class="sub">#1 · codzienna łamigłówka</div></div><div class="timer" id="timer">00:00</div></div>
  <div class="board" id="board" aria-label="Plansza Korony"></div>
  <div class="help">Umieść po jednej koronie w każdym wierszu, kolumnie i kolorowym obszarze. Korony nie mogą się stykać — nawet po skosie. Klikaj pole: <b>X → 👑 → puste</b>.</div>
  <div class="auto-row"><div class="auto-copy"><div class="auto-title">Automatyczne X</div><div class="auto-desc">Po ustawieniu korony oznacz wykluczone pola</div></div><label class="switch" aria-label="Automatyczne uzupełnianie X"><input type="checkbox" id="autoX"><span class="slider"></span></label></div>
  <div class="controls"><button class="action primary" id="hint">Wskazówka</button><button class="action" id="undo">Cofnij</button><button class="action" id="reset">Resetuj</button><button class="action" id="clearMarks">Wyczyść X</button></div>
  <div class="status" id="status"></div>
  <section class="done" id="done">Gotowe! 👑<br><strong id="finalTime"></strong></section>
</main>
<script>
const N=7;
const regions=[[0,0,0,1,1,1,1],[0,0,2,2,1,3,1],[0,2,2,4,3,3,1],[5,5,2,4,4,3,3],[5,6,6,6,4,4,3],[5,5,6,6,6,4,3],[5,5,5,6,6,4,4]];
let state=Array(N*N).fill(0),started=false,start=0,tick=null,finished=false,history=[];
let autoX=localStorage.getItem('figlo-auto-x')==='1';
const board=document.querySelector('#board'),timer=document.querySelector('#timer'),status=document.querySelector('#status'),done=document.querySelector('#done'),finalTime=document.querySelector('#finalTime'),autoXInput=document.querySelector('#autoX'),undoBtn=document.querySelector('#undo');
autoXInput.checked=autoX;
autoXInput.addEventListener('change',()=>{autoX=autoXInput.checked;localStorage.setItem('figlo-auto-x',autoX?'1':'0')});
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(started)return;started=true;start=Date.now();tick=setInterval(()=>timer.textContent=fmt(Date.now()-start),250)}
function crowns(s=state){return s.map((v,i)=>v===2?[Math.floor(i/N),i%N]:null).filter(Boolean)}
function conflicts(s=state){const cs=crowns(s),bad=new Set();for(let a=0;a<cs.length;a++)for(let b=a+1;b<cs.length;b++){const [r1,c1]=cs[a],[r2,c2]=cs[b];if(r1===r2||c1===c2||regions[r1][c1]===regions[r2][c2]||(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1)){bad.add(r1*N+c1);bad.add(r2*N+c2)}}return bad}
function valid(){const cs=crowns();if(cs.length!==N)return false;return new Set(cs.map(([r])=>r)).size===N&&new Set(cs.map(([,c])=>c)).size===N&&new Set(cs.map(([r,c])=>regions[r][c])).size===N&&conflicts().size===0}
function snapshot(){history.push([...state]);undoBtn.disabled=false}
function autoFillX(row,col){const region=regions[row][col];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(r===row&&c===col)continue;const i=r*N+c;if(state[i]===2)continue;if(r===row||c===col||regions[r][c]===region||(Math.abs(r-row)<=1&&Math.abs(c-col)<=1)){if(state[i]===0)state[i]=1}}}
function clearHintMarks(){[...board.children].forEach(el=>el.classList.remove('hint-candidate','hint-error'))}
function canPlace(r,c,s=state){const i=r*N+c;if(s[i]===1)return false;for(const [rr,cc] of crowns(s)){if(rr===r&&cc===c)continue;if(rr===r||cc===c||regions[rr][cc]===regions[r][c]||(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1))return false}return true}
function hasSolution(s){if(conflicts(s).size)return false;const fixedByRow=new Map(crowns(s).map(([r,c])=>[r,c]));const usedCols=new Set(),usedRegs=new Set();for(const [r,c] of crowns(s)){if(usedCols.has(c)||usedRegs.has(regions[r][c]))return false;usedCols.add(c);usedRegs.add(regions[r][c])}
  function dfs(r,lastCol){if(r===N)return true;if(fixedByRow.has(r)){const c=fixedByRow.get(r);if(r>0&&Math.abs(c-lastCol)<=1)return false;return dfs(r+1,c)}for(let c=0;c<N;c++){const i=r*N+c,reg=regions[r][c];if(s[i]===1||usedCols.has(c)||usedRegs.has(reg)||(r>0&&Math.abs(c-lastCol)<=1))continue;usedCols.add(c);usedRegs.add(reg);if(dfs(r+1,c))return true;usedCols.delete(c);usedRegs.delete(reg)}return false}return dfs(0,-99)}
function findMistake(){const bad=[...conflicts()];if(bad.length)return {cells:bad,text:'Te korony łamią zasady.'};const crownIdx=state.map((v,i)=>v===2?i:-1).filter(i=>i>=0);for(const i of crownIdx){const test=[...state];test[i]=0;if(hasSolution(test))return {cells:[i],text:'Ta korona prowadzi do sprzeczności.'}}const xIdx=state.map((v,i)=>v===1?i:-1).filter(i=>i>=0);for(const i of xIdx){const test=[...state];test[i]=0;if(hasSolution(test))return {cells:[i],text:'To pole zostało wykluczone nieprawidłowo.'}}return null}
function getHintCandidates(){const units=[];for(let reg=0;reg<N;reg++){const hasCrown=crowns().some(([r,c])=>regions[r][c]===reg);if(hasCrown)continue;const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(regions[r][c]===reg&&state[r*N+c]===0&&canPlace(r,c))cells.push(r*N+c);if(cells.length)units.push(cells)}for(let r=0;r<N;r++){if(crowns().some(([rr])=>rr===r))continue;const cells=[];for(let c=0;c<N;c++)if(state[r*N+c]===0&&canPlace(r,c))cells.push(r*N+c);if(cells.length)units.push(cells)}for(let c=0;c<N;c++){if(crowns().some(([,cc])=>cc===c))continue;const cells=[];for(let r=0;r<N;r++)if(state[r*N+c]===0&&canPlace(r,c))cells.push(r*N+c);if(cells.length)units.push(cells)}const useful=units.filter(x=>x.length>=2&&x.length<=4).sort((a,b)=>a.length-b.length);if(useful.length)return useful[0];const fallback=units.sort((a,b)=>a.length-b.length);return fallback[0]||[]}
function render(){const bad=conflicts();[...board.children].forEach((el,i)=>{const value=state[i];el.innerHTML=value===1?'<span class="mark">×</span>':value===2?'<span class="mark crown">♛</span>':'';el.classList.toggle('bad',bad.has(i))});undoBtn.disabled=history.length===0;status.textContent=bad.size?'Korony są w konflikcie.':'';if(valid()&&!finished){finished=true;clearInterval(tick);const t=started?fmt(Date.now()-start):'00:00';timer.textContent=t;finalTime.textContent='Twój czas: '+t;done.classList.add('show');status.textContent='Brawo! Plansza rozwiązana.'}}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const el=document.createElement('button');const reg=regions[r][c];el.className='cell r'+reg;el.type='button';if(r===0||regions[r-1][c]!==reg)el.classList.add('rt');if(c===N-1||regions[r][c+1]!==reg)el.classList.add('rr');if(r===N-1||regions[r+1][c]!==reg)el.classList.add('rb');if(c===0||regions[r][c-1]!==reg)el.classList.add('rl');el.setAttribute('aria-label',`wiersz ${r+1}, kolumna ${c+1}`);el.addEventListener('click',()=>{if(finished)return;clearHintMarks();startTimer();snapshot();const i=r*N+c;state[i]=(state[i]+1)%3;if(state[i]===2&&autoX)autoFillX(r,c);render()});board.appendChild(el)}
document.querySelector('#undo').addEventListener('click',()=>{if(!history.length||finished)return;clearHintMarks();state=history.pop();render()});
document.querySelector('#reset').addEventListener('click',()=>{clearHintMarks();clearInterval(tick);state.fill(0);history=[];started=false;finished=false;start=0;timer.textContent='00:00';status.textContent='';done.classList.remove('show');render()});
document.querySelector('#clearMarks').addEventListener('click',()=>{if(finished)return;clearHintMarks();snapshot();state=state.map(v=>v===1?0:v);render()});
document.querySelector('#hint').addEventListener('click',()=>{if(finished)return;startTimer();clearHintMarks();const mistake=findMistake();if(mistake){mistake.cells.forEach(i=>board.children[i].classList.add('hint-error'));status.textContent=mistake.text;return}const cells=getHintCandidates();if(!cells.length){status.textContent='Nie widzę teraz użytecznej wskazówki.';return}cells.forEach(i=>board.children[i].classList.add('hint-candidate'));status.textContent=cells.length===1?'Korona musi znaleźć się na tym polu.':'Korona może znaleźć się na jednym z podświetlonych pól.'});
render();
</script>
</body>
</html>
