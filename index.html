<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figlo — Korony</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#171717;background:#f7f5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.app{width:min(94vw,560px);padding:32px 20px;text-align:center}.brand{font-size:22px;font-weight:800;letter-spacing:-.04em;margin-bottom:28px}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px;text-align:left}h1{font-size:36px;line-height:1;margin:0 0 7px;letter-spacing:-.05em}.sub{color:#666;font-size:14px}.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.board{display:grid;grid-template-columns:repeat(7,1fr);aspect-ratio:1;border:3px solid #171717;background:#171717;gap:2px;user-select:none}.cell{border:0;font:inherit;font-size:clamp(22px,6vw,34px);cursor:pointer;display:grid;place-items:center;color:#171717;transition:filter .12s,transform .08s}.cell:active{transform:scale(.95)}.cell.bad{box-shadow:inset 0 0 0 4px #d33}.r0{background:#f4b8c2}.r1{background:#a8d8ea}.r2{background:#b9dfad}.r3{background:#f7d794}.r4{background:#c9b6e4}.r5{background:#f2a65a}.r6{background:#a7c7a1}.help{margin:18px auto 0;color:#666;font-size:13px;line-height:1.45;max-width:460px}.status{min-height:26px;margin-top:14px;font-weight:700}.done{margin-top:18px;padding:18px;border:2px solid #171717;border-radius:14px;background:#fff;display:none}.done.show{display:block}.done strong{font-size:24px}button.reset{margin-top:14px;border:0;background:none;text-decoration:underline;cursor:pointer;color:#555}@media(max-width:480px){.app{padding:22px 12px}h1{font-size:30px}}
</style>
</head>
<body><main class="app"><div class="brand">figlo</div><div class="top"><div><h1>Korony</h1><div class="sub">#1 · codzienna łamigłówka</div></div><div class="timer" id="timer">00:00</div></div><div class="board" id="board" aria-label="Plansza Korony"></div><div class="help">Umieść po jednej koronie w każdym wierszu, kolumnie i kolorowym obszarze. Korony nie mogą się stykać — nawet po skosie. Kliknij pole: <b>X → 👑 → puste</b>.</div><div class="status" id="status"></div><section class="done" id="done">Gotowe! 👑<br><strong id="finalTime"></strong></section><button class="reset" id="reset">Zacznij od nowa</button></main>
<script>
const N=7;
const regions=[[0,0,0,1,1,1,1],[0,0,2,2,1,3,1],[0,2,2,4,3,3,1],[5,5,2,4,4,3,3],[5,6,6,6,4,4,3],[5,5,6,6,6,4,3],[5,5,5,6,6,4,4]];
const solution=[[0,1],[1,4],[2,6],[3,2],[4,5],[5,0],[6,3]];
let state=Array(N*N).fill(0),started=false,start=0,tick=null,finished=false;
const board=document.querySelector('#board'),timer=document.querySelector('#timer'),status=document.querySelector('#status'),done=document.querySelector('#done');
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(started)return;started=true;start=Date.now();tick=setInterval(()=>timer.textContent=fmt(Date.now()-start),250)}
function crowns(){return state.map((v,i)=>v===2?[Math.floor(i/N),i%N]:null).filter(Boolean)}
function conflicts(){const cs=crowns(),bad=new Set();for(let a=0;a<cs.length;a++)for(let b=a+1;b<cs.length;b++){const [r1,c1]=cs[a],[r2,c2]=cs[b];if(r1===r2||c1===c2||regions[r1][c1]===regions[r2][c2]||(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1)){bad.add(r1*N+c1);bad.add(r2*N+c2)}}return bad}
function valid(){const cs=crowns();if(cs.length!==N)return false;const rows=new Set(cs.map(x=>x[0])),cols=new Set(cs.map(x=>x[1])),regs=new Set(cs.map(([r,c])=>regions[r][c]););return rows.size===N&&cols.size===N&&regs.size===N&&conflicts().size===0}
function render(){const bad=conflicts();[...board.children].forEach((el,i)=>{el.textContent=state[i]===1?'×':state[i]===2?'♛':'';el.classList.toggle('bad',bad.has(i))});status.textContent=bad.size?'Korony są w konflikcie.':'';if(valid()&&!finished){finished=true;clearInterval(tick);const t=started?fmt(Date.now()-start):'00:00';timer.textContent=t;document.querySelector('#finalTime').textContent='Twój czas: '+t;done.classList.add('show');status.textContent='Brawo! Plansza rozwiązana.'}}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const el=document.createElement('button');el.className='cell r'+regions[r][c];el.setAttribute('aria-label',`wiersz ${r+1}, kolumna ${c+1}`);el.onclick=()=>{if(finished)return;startTimer();const i=r*N+c;state[i]=(state[i]+1)%3;render()};board.appendChild(el)}
document.querySelector('#reset').onclick=()=>{clearInterval(tick);state.fill(0);started=false;finished=false;start=0;timer.textContent='00:00';status.textContent='';done.classList.remove('show');render()};render();
</script></body></html>
