name: Refresh Duet daily puzzles

# The only automated writer of daily puzzles. Published records are immutable.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duet-daily-buffer.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: duet-daily-buffer
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve today's date in Warsaw
        id: date
        shell: bash
        run: echo "today=$(TZ=Europe/Warsaw date +%F)" >> "$GITHUB_OUTPUT"

      - name: Fill and validate 365 days of Duet
        run: node scripts/generate-duet-daily.mjs --start "${{ steps.date.outputs.today }}" --days 365 --skip-existing

      - name: Verify buffer automation is idempotent
        run: node --test tests/duet-buffer-automation.test.mjs tests/duet-buffer.test.mjs

      - name: Commit generated daily assets
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/duet/
          if git diff --cached --quiet; then
            echo "No new Duet puzzles needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(duet): extend validated daily buffer to 365 days"
          # A concurrent main update must fail this push. Do not rebase an
          # untested tree or overwrite a puzzle added by another contributor.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger CI. A dispatch does, and the
      # publisher tests its exact checkout before touching the live branch.
      - name: Request tested publication
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-tested-main.yml --ref main

