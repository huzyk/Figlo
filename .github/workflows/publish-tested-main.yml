name: Publish tested main to GitHub Pages

# Keep the existing Pages source (preview, repository root). Every entrypoint
# tests its own immutable checkout, including manual and scheduled publication.
on:
  workflow_run:
    workflows: ["Figlo tests"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-tested-main-to-preview
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the revision to test and publish
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record the immutable revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests for this revision
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests for this revision
        run: npm run test:e2e

      - name: Verify the production Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq \
            'if .build_type == "legacy" and .source.branch == "preview" and .source.path == "/" then "Pages source verified" else error("Expected Pages source preview /; see RELEASE.md before changing hosting") end'

      - name: Publish the tested revision with fast-forward only
        id: sync
        env:
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
        run: node scripts/publish-tested-main.mjs "$TESTED_SHA"

      - name: Request a Pages build of the tested preview branch
        if: steps.sync.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          preview="$(git ls-remote origin refs/heads/preview | cut -f1)"
          if [[ "$preview" != "$TESTED_SHA" ]]; then
            echo "preview has advanced; the newer publisher owns its build."
            exit 0
          fi
          # GITHUB_TOKEN branch pushes do not trigger Pages automatically.
          # Request again on a rerun even if the prior push succeeded but the
          # Pages API or build failed afterwards.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
