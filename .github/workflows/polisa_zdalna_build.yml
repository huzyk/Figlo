name: Build Polisa Zdalna standalone

on:
  push:
    branches:
      - tmp-polisa-standalone-build
    paths:
      - "tools/polisa_zdalna/**"
      - ".github/workflows/polisa_zdalna_build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PolisaZdalna tools/polisa_zdalna/polisa_app.py
          if (!(Test-Path dist/PolisaZdalna.exe)) { throw "EXE not created" }
          Get-Item dist/PolisaZdalna.exe | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PolisaZdalna-standalone
          path: dist/PolisaZdalna.exe
          if-no-files-found: error
          retention-days: 1
