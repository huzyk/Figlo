name: Refresh Duet daily buffer

on:
  push:
    branches: [preview]
    paths:
      - 'src/duet/**'
      - 'scripts/generate-duet-daily.mjs'
      - '.github/workflows/refresh-duet-today.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate 45-day Duet buffer from today
        shell: bash
        run: |
          START=$(TZ=Europe/Warsaw date +%F)
          echo "Generating Duet daily buffer from $START"
          node scripts/generate-duet-daily.mjs --start "$START" --days 45

      - name: Commit refreshed daily buffer
        shell: bash
        run: |
          if git diff --quiet -- data/duet; then
            echo "No Duet daily changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duet
          git commit -m "chore: refresh Duet daily buffer"
          git push origin preview
